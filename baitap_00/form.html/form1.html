<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM</title>
</head>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Arial', sans-serif;
}

body {
    background: linear-gradient(135deg, #28d1fa 0%);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-box {
    background: #fff;
    width: 400px;
    padding: 40px;
    border-radius: 10px;
    box-shadow: 0 15px 25px rgba(0,0,0,0.2);
    text-align: center;
}

h2 {
    margin-bottom: 30px;
    font-size: 28px;
    color: #333;
}

.input-group {
    text-align: left;
    margin-bottom: 20px;
}

.input-group label {
    font-size: 14px;
    color: #666;
    display: block;
    margin-bottom: 8px;
}

.input-field {
    display: flex;
    align-items: center;
    border-bottom: 2px solid #d9d9d9;
    padding: 5px 0;
}

.input-field i {
    color: #adadad;
    margin-right: 10px;
}

.input-field input {
    border: none;
    outline: none;
    width: 100%;
    font-size: 16px;
    padding: 5px;
}

.forgot-pass {
    text-align: right;
    margin-top: 5px;
}

.forgot-pass a {
    font-size: 13px;
    color: #666;
    text-decoration: none;
}

.btn-login {
    width: 100%;
    padding: 12px;
    margin-top: 30px;
    border: none;
    border-radius: 25px;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    background: linear-gradient(to right, #21d4fd);
    transition: 0.3s;
}

.btn-login:hover {
    opacity: 0.9;
}

.social-login {
    margin-top: 40px;
}

.social-login span {
    font-size: 14px;
    color: #666;
}

.icons {
    margin-top: 20px;
    display: flex;
    justify-content: center;
    gap: 15px;
}

.icons a {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fff;
    text-decoration: none;
    font-size: 18px;
}
</style>
<body>
    <div class="container">
        <div class="login-box">
            <h2>Login</h2>
            
            <form>
                <div class="input-group">
                    <label>Username</label>
                    <div class="input-field">
                        <input type="text" placeholder="Type your username">
                    </div>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <div class="input-field">
                        <input type="password" placeholder="Type your password">
                    </div>
                    <div class="forgot-pass">
                        <a href="#">Forgot password?</a>
                    </div>
                </div>

                <button type="submit" class="btn-login">LOGIN</button>

                <div class="social-login">
                    <span>Or Sign Up Using</span>
                    <div class="icons">
                        <a href="#" class="fb"><i class="fa-brands fa-facebook-f"></i></a>
                        <a href="#" class="tw"><i class="fa-brands fa-twitter"></i></a>
                        <a href="#" class="gg"><i class="fa-brands fa-google"></i></a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
